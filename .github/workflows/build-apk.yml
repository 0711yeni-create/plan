name: O.HOME Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e
          mkdir -p extracted

          while IFS= read -r -d '' zipfile; do
            echo "Extracting: $zipfile"
            unzip -o "$zipfile" -d extracted
          done < <(
            find . -path './extracted' -prune -o \
              -type f -iname '*.zip' -print0
          )

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          for ROOT in . extracted; do
            FOUND=$(find "$ROOT" \
              -path '*/.gradle' -prune -o \
              -type f -name 'settings.gradle.kts' -print \
              -quit 2>/dev/null || true)

            if [ -n "$FOUND" ]; then
              PROJECT_DIR=$(dirname "$FOUND")
              break
            fi

            FOUND=$(find "$ROOT" \
              -path '*/.gradle' -prune -o \
              -type f -name 'settings.gradle' -print \
              -quit 2>/dev/null || true)

            if [ -n "$FOUND" ]; then
              PROJECT_DIR=$(dirname "$FOUND")
              break
            fi
          done

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Could not find settings.gradle or settings.gradle.kts."
            echo "Files in repository:"
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::Android app module was not found."
            find "$PROJECT_DIR" -maxdepth 3 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: O-HOME-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
