name: O.HOME Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub 저장소 다운로드
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. ZIP 파일 압축 해제
      - name: Extract project ZIP
        shell: bash
        run: |
          set -e
          mkdir -p extracted

          while IFS= read -r -d '' file; do
            echo "Extracting $file"
            unzip -o "$file" -d extracted
          done < <(
            find . \
              -path './extracted' -prune -o \
              -type f -iname '*.zip' -print0
          )

      # 3. Android 프로젝트 찾기
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          for ROOT in . extracted; do
            FOUND=$(find "$ROOT" \
              -type d \( -name .git -o -name .gradle \) -prune \
              -o -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print -quit 2>/dev/null || true)

            if [ -n "$FOUND" ]; then
              PROJECT_DIR=$(dirname "$FOUND")
              break
            fi
          done

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Android project settings file not found."
            echo "Files found:"
            find . -maxdepth 5 -type f | head -200
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::The app module was not found."
            find "$PROJECT_DIR" -maxdepth 3 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      # 4. Java 설치
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 5. Gradle 설치
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 6. Android SDK 도구 설치
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: 'false'

      # 7. SDK 라이선스 자동 승인
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -o pipefail
          yes | sdkmanager --licenses

      # 8. 빌드에 필요한 Android 패키지 설치
      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 9. Android 앱 빌드
      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      # 10. APK 파일 업로드
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: O-HOME-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
