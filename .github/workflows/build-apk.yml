name: O.HOME Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      # 1. 저장소 가져오기
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Android SDK 도구 설치 및 경로 설정
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y unzip wget

          mkdir -p "$ANDROID_HOME/cmdline-tools"

          SDKMANAGER=""

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -name sdkmanager -print -quit 2>/dev/null || true)
          fi

          if [ -z "$SDKMANAGER" ]; then
            TMP_DIR=$(mktemp -d)

            wget -q \
              https://dl.google.com/android/repository/commandlinetools-linux-11479570_latest.zip \
              -O "$TMP_DIR/tools.zip"

            unzip -q "$TMP_DIR/tools.zip" -d "$TMP_DIR"

            mkdir -p "$ANDROID_HOME/cmdline-tools/13.0"
            cp -a "$TMP_DIR/cmdline-tools/." \
              "$ANDROID_HOME/cmdline-tools/13.0/"

            rm -rf "$TMP_DIR"

            SDKMANAGER="$ANDROID_HOME/cmdline-tools/13.0/bin/sdkmanager"
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          "$SDKMANAGER" --version

      # 3. ZIP 파일 압축 해제
      - name: Extract project ZIP
        shell: bash
        run: |
          set -e
          mkdir -p extracted

          while IFS= read -r -d '' file; do
            echo "Extracting: $file"
            unzip -o "$file" -d extracted
          done < <(
            find . \
              -path './extracted' -prune -o \
              -path './.git' -prune -o \
              -type f -iname '*.zip' -print0
          )

      # 4. Android 프로젝트 찾기
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          for ROOT in . extracted; do
            FOUND=$(find "$ROOT" \
              -type d \( -name .git -o -name .gradle \) -prune \
              -o -type f \
              \( -name settings.gradle.kts -o -name settings.gradle \) \
              -print -quit 2>/dev/null || true)

            if [ -n "$FOUND" ]; then
              PROJECT_DIR=$(dirname "$FOUND")
              break
            fi
          done

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Android project settings file not found."
            find . -maxdepth 5 -type f | head -200
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::Android app module not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      # 5. Java 17 설치
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 6. Gradle 설치
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 7. Android SDK 라이선스 승인
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e
          set +o pipefail

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses

      # 8. 필요한 Android SDK 설치
      - name: Install Android SDK packages
        shell: bash
        run: |
          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 9. APK 빌드
      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      # 10. APK 업로드
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: O-HOME-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
